name: pris-booths-test
services:
  postgres:
    image: postgres:16-alpine
    container_name: pris-booth-development-test
    environment:
      POSTGRES_USER: booth_test
      POSTGRES_PASSWORD: booth_test
      POSTGRES_DB: pris_booth_test
    ports:
      - "127.0.0.1:55434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booth_test -d pris_booth_test"]
      interval: 2s
      timeout: 3s
      retries: 30
